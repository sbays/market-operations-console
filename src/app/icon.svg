<!-- Favicon: three rising bars on the primary colour. An icon can't read the app's CSS
     variables, so the colours repeat the --primary and --primary-foreground tokens. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="oklch(0.45 0.12 255)" />
  <g fill="oklch(0.985 0 0)">
    <rect x="7" y="17" width="4.5" height="8" rx="1" />
    <rect x="13.75" y="12" width="4.5" height="13" rx="1" />
    <rect x="20.5" y="7" width="4.5" height="18" rx="1" />
  </g>
</svg>
